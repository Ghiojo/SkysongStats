plugins {
    id 'java'
}

group = 'org.skysongdev'
version = '1.3'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/releases/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:1.21.5-R0.1-SNAPSHOT"
    implementation 'net.luckperms:api:5.3'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // Connection pool for the stat tables. Paper downloads it at startup from the
    // plugin.yml "libraries:" list (added when the plugin starts using it), so it
    // is not bundled into the jar.
    compileOnly 'com.zaxxer:HikariCP:6.2.1'

    // Unit tests: JUnit + MockBukkit (a fake Paper server for tests), the same
    // stack Skysong-Special-Items uses. MockBukkit 4.116.3 is built against
    // Paper 1.21.11 (what the server runs) and no longer brings the Paper API
    // itself, so the tests add it.
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.116.3'
    testImplementation "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    // In-memory SQL database for tests that run Database queries without MySQL.
    // SQLite, not H2: the current SQL uses MySQL-style "double-quoted" string
    // literals, which H2 rejects.
    testImplementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    // The new stat tables are tested on H2 in MySQL mode: their SQL is plain MySQL.
    testImplementation 'com.h2database:h2:2.3.232'
    testImplementation 'com.zaxxer:HikariCP:6.2.1'
    // StatsExpansion extends PlaceholderAPI's PlaceholderExpansion.
    testImplementation 'me.clip:placeholderapi:2.11.6'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
