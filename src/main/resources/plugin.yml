name: SkysongStats
version: '${version}'
main: org.skysongdev.skysongstats.SkysongStats
api-version: '1.21.11'

# LuckPerms holds the skill level nodes, and Skysong_Items' API gives the item
# tags that stats.yml counts, so the plugin can't run without either.
depend: [LuckPerms, Skysong_Items]
softdepend: [PlaceholderAPI]
# Downloaded by Paper at startup: the connection pool for the stat tables.
libraries:
  - com.zaxxer:HikariCP:6.2.1
loadbefore: [CMI, CMILib]

commands:
  sstats:
    description: "View your stats"
    usage: "/stats [player]"
    permission: "skysongstats.stats"
  statsreload:
    description: "Reload the plugin"
    usage: "/statsreload"
    permission: "skysongstats.reload"
  skills:
    description: "View your skills"
    usage: "/skills [player]"
    permission: "skysongstats.skills"
  setup:
    description: "Setup the plugin"
    usage: "/setup"
    permission: "skysongstats.setup"
  modifier:
    description: "View your modifiers"
    usage: "/modifier [player]"
    permission: "skysongstats.modifier"
  ssimport:
    description: "Import injuries and conditions from SkysongChatTweaks"
    usage: "/ssimport chattweaks"
    permission: "skysongstats.import"
  ssreload:
    description: "Reload the plugin"
    usage: "/ssreload"
    permission: "skysongstats.ssreload"
  schar:
    description: "View your character"
    usage: "/schar [player]"
    permission: "skysongstats.schar"
  profile:
    description: "View your profile"
    usage: "/profile [player]"
    permission: "skysongstats.profile"
  char:
    description: "View your character"
    usage: "/char [player]"
    permission: "skysongstats.char"
  stats:
    description: "View your stats"
    usage: "/stats [player]"
    permission: "skysongstats.stats"
  proficiency:
    description: "View and train your proficiencies"
    usage: "/proficiency [view|focus|points|tier]"
    aliases:
      - prof
  downtime:
    description: "Set your downtime"
    usage: "/downtime [player] [amount]"
    aliases:
      - dt
  injury:
    description: "View and manage characters' injuries"
    usage: "/injury [list|award|remove|discover|forget]"
  condition:
    description: "View and manage characters' conditions"
    usage: "/condition [list|award|remove]"
  injuries:
    description: "Look through the injuries your character knows"
    usage: "/injuries [view [severity]|search <text>]"
    permission: "skysongstats.injuries"
  conditions:
    description: "Look through every condition"
    usage: "/conditions [search <text>]"
    permission: "skysongstats.conditions"
permissions:
  # The stat command nodes (skysongstats.stat.<stat>.<action>[.other]) are made
  # from stats.yml when the plugin starts and on /ssreload.
  skysongstats.stats.view.other:
    description: "Allows you to view other players' stat sheets"
    default: true
  skysongstats.reload:
    description: "Allows you to reload the plugin"
    default: op
  skysongstats.modifier.add.other:
    description: "Allows you to add modifiers to other players"
    default: op
  skysongstats.modifier.del.other:
    description: "Allows you to remove modifiers from other players"
    default: op
  skysongstats.modifier.view.other:
    description: "Allows you to view other players modifiers"
    default: op
  skysongstats.addxp:
    description: "Allows you to add xp to yourself"
    default: op
  skysongstats.setxp:
    description: "Allows you to set xp to yourself"
    default: op
  skysongstats.downtime.manage:
    description: "Allows you to add, remove and reset downtime"
    default: op
  skysongstats.downtime.view.others:
    description: "Allows you to view other players' downtime"
    default: op
  skysongstats.proficiencies.view:
    description: "Allows you to view your proficiencies"
    default: true
  skysongstats.proficiencies.view.other:
    description: "Allows you to view other players' proficiencies"
    default: op
  skysongstats.proficiencies.focus:
    description: "Allows you to choose the proficiency you train"
    default: true
  skysongstats.proficiencies.manage:
    description: "Allows you to add, remove and set proficiency points and tiers"
    default: op
  skysongstats.injury.list:
    description: "Allows you to list your injuries"
    default: true
  skysongstats.injury.list.other:
    description: "Allows you to list other players' injuries"
    default: op
  skysongstats.injury.award:
    description: "Allows you to give injuries"
    default: op
  skysongstats.injury.remove:
    description: "Allows you to remove injuries"
    default: op
  skysongstats.injury.discover:
    description: "Allows you to teach and unteach injuries"
    default: op
  skysongstats.condition.list:
    description: "Allows you to list your conditions"
    default: true
  skysongstats.condition.list.other:
    description: "Allows you to list other players' conditions"
    default: op
  skysongstats.condition.award:
    description: "Allows you to give conditions"
    default: op
  skysongstats.condition.remove:
    description: "Allows you to remove conditions"
    default: op
  skysongstats.import:
    description: "Allows you to run /ssimport chattweaks"
    default: op
  skysongstats.injuries:
    description: "Allows you to open the /injuries menu"
    default: true
  skysongstats.conditions:
    description: "Allows you to open the /conditions menu"
    default: true
  skysongstats.*:
    description: "Wildcard permission"
    default: op
    children:
        skysongstats.reload: true
        skysongstats.stats.view.other: true
        skysongstats.modifier.add.other: true
        skysongstats.modifier.del.other: true
        skysongstats.modifier.view.other: true
        skysongstats.addxp: true
        skysongstats.setxp: true
        skysongstats.proficiencies.view: true
        skysongstats.proficiencies.view.other: true
        skysongstats.proficiencies.focus: true
        skysongstats.proficiencies.manage: true
        skysongstats.injury.list: true
        skysongstats.injury.list.other: true
        skysongstats.injury.award: true
        skysongstats.injury.remove: true
        skysongstats.injury.discover: true
        skysongstats.condition.list: true
        skysongstats.condition.list.other: true
        skysongstats.condition.award: true
        skysongstats.condition.remove: true
        skysongstats.import: true
        skysongstats.injuries: true
        skysongstats.conditions: true
