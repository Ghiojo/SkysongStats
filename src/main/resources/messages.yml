# Every message SkysongStats sends to players and to the console.
# Translate the plugin by changing the text here, then run /ssreload.
#
# Messages use MiniMessage: https://docs.advntr.dev/minimessage/format.html
# {prefix} is replaced by the prefix below. Other {names} are filled in by the
# plugin; the ones each message gets are listed above it. A message can be one
# line, or a list of lines.
#
# When an update adds messages, they are written into this file with their
# default text. Lines you changed are kept.
prefix: "<dark_gray>[<gold>SkysongStats<dark_gray>] "

general:
  no-permission: "{prefix}<red>You don't have permission to use this command!"
  reloaded: "{prefix}<gray>Config Reloaded!"
  # {file}. Sent after "reloaded" for each file with mistakes; the console lists them.
  not-reloaded: "{prefix}<red>{file} has mistakes and was not reloaded, the previous version is still in use. See the console for details."
  # {player}
  player-not-found: "{prefix}<red>Player {player} not found!"
  console-needs-player: "{prefix}<red>You must specify a player if you are running this command on console!"
  players-only: "{prefix}<red>Only players can use this command!"
  # {input}
  not-a-number: "{prefix}<yellow>\"{input}\" <red>is not a number!"

downtime:
  usage: "{prefix}<red>Invalid arguments! Use /downtime <subcommand>"
  unknown-subcommand: "{prefix}<red>Unknown subcommand!"
  no-permission: "{prefix}<red>You do not have permission to use this command."
  players-only: "{prefix}<red>Only players can set downtime preferences!"
  # {player}
  player-not-found: "{prefix}<red>Player {player} not found or has no profile."
  # {profile}, {player}
  profile-not-found: "{prefix}<red>Profile {profile} not found for player {player}."
  invalid-amount: "{prefix}<red>Amount must be a whole number of 1 or more."
  # The words {preference} becomes in the messages below.
  preference-global: "Global"
  preference-character: "Character"
  add:
    usage: "{prefix}<red>Usage: /downtime add <amount> <player> <global/profile>"
    # {amount}, {player}, {total}; the -capped versions are used when the maximum stopped the change.
    global: "{prefix}<green>Added {amount} downtime to player {player}'s global downtime, now {total}."
    global-capped: "{prefix}<green>Added {amount} downtime to player {player}'s global downtime, now {total}. (capped at the maximum)"
    # {amount}, {player}, {profile}, {total}
    profile: "{prefix}<green>Added {amount} downtime to player {player}'s profile {profile}, now {total}."
    profile-capped: "{prefix}<green>Added {amount} downtime to player {player}'s profile {profile}, now {total}. (capped at the maximum)"
  remove:
    usage: "{prefix}<red>Usage: /downtime remove <amount> <player> [global/profile]"
    # {amount}, {player}, {total}; the -stopped versions are used when the downtime reached 0.
    global: "{prefix}<green>Successfully removed {amount} downtime from {player}'s global downtime, now {total}."
    global-stopped: "{prefix}<green>Successfully removed {amount} downtime from {player}'s global downtime, now {total}. (stopped at 0)"
    # {amount}, {player}, {profile}, {total}
    profile: "{prefix}<green>Successfully removed {amount} downtime from {player}'s {profile} profile downtime, now {total}."
    profile-stopped: "{prefix}<green>Successfully removed {amount} downtime from {player}'s {profile} profile downtime, now {total}. (stopped at 0)"
  view:
    usage: "{prefix}<red>Usage: /downtime view <player>"
    no-permission-others: "{prefix}<red>You do not have permission to view other players' downtime."
    # {player}
    no-active-profile: "{prefix}<red>{player} has no active profile."
    # {player}, {global}, {character}, {preference}
    lines:
      - "<gold>{player}<green>'s Downtime:"
      - "<green>- Global Downtime: <gold>{global}"
      - "<green>- Character Downtime: <gold>{character}"
      - "<green>- Active Downtime Spending Preference: <gold>{preference}"
  # {preference}
  preference-set: "{prefix}<green>Your downtime spending preference has been set to <gold>{preference}<green>."
  reset-all: "{prefix}<green>All downtimes have been reset successfully."

profile:
  usage: "{prefix}<red>Too Little arguments! (Usage: /profile (subcommand))"
  invalid-subcommand: "{prefix}<red>Incorrect Arguments! Usage: /profile (create/switch/delete) (profile)"
  # {profile}
  current: "{prefix}<gray>Your current profile is <yellow>{profile}"
  # Sent on join while the active profile has not finished /setup.
  setup-reminder: "{prefix}<green>You have yet to set up your profile! Use /setup to get started!"
  create:
    usage: "{prefix}<gray>Too Little arguments! (Usage: /profile create (name))"
    already-exists: "{prefix}<gray>You already have a profile with this name!"
    name-too-long: "{prefix}<gray>Profile name is too long! (Max 20 characters)"
    # {profile}
    created: "{prefix}<gray>Profile \"{profile}\" has been created!"
  switch:
    usage: "{prefix}<red>Too Little arguments! (Usage: /profile switch (name))"
    not-found: "{prefix}<red>You have no profile with that name!"
    # {profile}
    switched: "{prefix}<green>Profile switched to {profile}"
  delete:
    usage: "{prefix}<red>Too Little arguments! (Usage: /profile delete (name))"
    not-found: "{prefix}<red>There's no profile with that name!"
    active: "{prefix}<red>You cannot delete the profile you are currently on, switch profiles before doing so!"
    # {profile}
    deleted: "{prefix}<gray>Profile \"{profile}\" has been deleted!"

character:
  invalid-subcommand: "{prefix}<red>Invalid subcommand!"
  view:
    needs-player: "You must specify a player to view their character!"
    player-not-online: "That player is not online!"
    # The character sheet: header, then the description wrapped into lines of about
    # 60 characters (one description-line each), then footer.
    # {player}, {name}, {age}, {gender}, {pronouns}, {ancestry}
    header:
      - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
      - "                <#F6DA23>{player}' s <#864811>Character Sheet:"
      - ""
      - "<#D0530C><bold>Name:</bold> <#f8e886>{name}"
      - "<#D0530C><bold>Age:</bold> <#f8e886>{age}"
      - "<#D0530C><bold>Gender:</bold> <#f8e886>{gender}<#e7d462>({pronouns})"
      - "<#D0530C><bold>Ancestry:</bold> <#f8e886>{ancestry}"
      - "<#D0530C><bold>Description:</bold>"
    # {line}
    description-line: "<#f8e886>{line}"
    footer:
      - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
  set:
    players-only: "Only players can use this command!"
    usage: "{prefix}<red>Too Little arguments! (Usage: /character set (field) (value))"
    name-too-long: "{prefix}<red>Name is too long!"
    age-too-long: "{prefix}<red>Age is too long!"
    gender-too-long: "{prefix}<red>Gender is too long!"
    pronouns-too-long: "{prefix}<red>Pronouns are too long!"
    ancestry-too-long: "{prefix}<red>Ancestry is too long!"
    invalid-field: "Invalid field!"
    failed: "{prefix}<red>Failed to update character data!"
    # {field}, {value}
    updated: "{prefix}<green>Updated {field} to {value}"

skills:
  invalid-subcommand: "{prefix}<red>Incorrect Arguments! Usage: /skill (addxp/setxp/view) (skill) (value)"
  invalid-skill: "{prefix}<red>Invalid Skill!"
  invalid-xp: "{prefix}<red>Invalid XP!"
  addxp:
    usage: "{prefix}<red>Too Little arguments! (Usage: /skill addxp (skill) (xp) (player (optional)))"
    # {xp}, {player}, {skill}
    added: "{prefix}<red>Added {xp} XP to {player}'s {skill} skill!"
    # Sent to the player who got the XP. {xp}, {skill}
    gained: "{prefix}<green>You have gained <gold>{xp} XP <green>in your {skill} skill!"
  setxp:
    usage: "{prefix}<red>Too Little arguments! (Usage: /skill setxp (skill) (xp) (player (optional)))"
    # {skill}, {xp}, {player}
    set: "{prefix}<red>Set {skill} XP to {xp} for {player}"
  view:
    book-title: "Skills"
    book-author: "Skysong"
    # One book page per book: entry of skills.yml. {title} is the page's title
    # there, {skills} its skill-line entries, one per line.
    page: "{title}\n\n{skills}"
    # The title of the extra last page that lists the skills on no page.
    other-title: "<gray>Other Skills:</gray>"
    # {skill} and {level} are the coloured skill name and level; {xp}
    skill-line: "{skill}: {level}({xp})"
  # The skill picker shown during /setup.
  choice:
    title: "<gold><bold>Skills Selection"
    # {points}
    lore:
      - "<gray>Select two skills that you want to specialize in."
      - "<gray>You can't change them later."
      - "<gray>You have {points} skills left to choose."
    confirm: "<green>Confirm"
    # The name of each skill on the screen, in the skill's colour from skills.yml. {name}
    skill-name: "<bold>{name}</bold>"
    # Confirming with picks left. {picks}
    pick-more: "{prefix}<red>Pick {picks} more skill(s) before confirming."

# /proficiency (alias /prof). Proficiency, tier and skill names come from
# proficiencies.yml and skills.yml.
proficiency:
  invalid-subcommand: "{prefix}<red>Incorrect Arguments! Usage: /proficiency (view/focus/points/tier)"
  # {input}
  unknown-proficiency: "{prefix}<red>There is no proficiency called {input}!"
  unknown-tier: "{prefix}<red>There is no proficiency tier called {input}!"
  unknown-skill: "{prefix}<red>There is no skill called {input}!"
  # {input} {min}
  invalid-amount: "{prefix}<red>\"{input}\" must be a whole number of at least {min}!"
  # /proficiency view. {player}; {focus} is one of the sheet-focus lines below and
  # {proficiencies} one sheet-skill line per skill that has proficiencies.
  sheet:
    - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
    - "                <#F6DA23>{player}' s <#864811>Proficiencies:"
    - ""
    - "{focus}"
    - ""
    - "{proficiencies}"
    - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
  # {skill} is the skill's name in its colour, {proficiencies} its sheet-entry
  # parts joined with sheet-separator.
  sheet-skill: "{skill}<#864811>: {proficiencies}"
  # {proficiency} and {tier}, each in its colour from proficiencies.yml.
  sheet-entry: "{proficiency} <#864811>({tier}<#864811>)"
  sheet-separator: "<#864811>, "
  # {proficiency}, {next} (the tier it is training towards), {points}, {cost}
  sheet-focus: "<#D0530C><bold>Focus:</bold> {proficiency} <#f8e886>{points}/{cost} <#864811>towards {next}"
  sheet-no-focus: "<#D0530C><bold>Focus:</bold> <gray>none. Pick one with /proficiency focus (proficiency)"
  focus:
    usage: "{prefix}<red>Usage: /proficiency focus (proficiency)"
    # {proficiency}
    focused: "{prefix}<green>You are now training {proficiency}."
    already-focused: "{prefix}<yellow>You are already training {proficiency}."
    mastered: "{prefix}<yellow>You have already mastered {proficiency}, pick another proficiency to train."
    # Switching would lose the current focus's points. {proficiency} {current} {points}
    confirm:
      - "{prefix}<yellow>Training {proficiency} instead of {current} loses your {points} points in {current}."
      - "{prefix}<yellow>Are you sure? <click:run_command:'/proficiency focus confirm'><hover:show_text:'<green>Switch your focus'><green><bold>[Yes]</bold></green></hover></click> <gray>(within a minute)"
    nothing-to-confirm: "{prefix}<red>There is no focus change to confirm, or it ran out."
  points:
    usage: "{prefix}<red>Usage: /proficiency points (add/remove/set) (player) (amount)"
    # {player}
    no-focus: "{prefix}<red>{player} isn't training any proficiency."
    add:
      usage: "{prefix}<red>Usage: /proficiency points add (player) (amount) (skill) (max-tier)"
      # Each result has a message for whoever ran the command and one, ending in
      # -target, for the player trained. Every one has {player} {amount} {skill}
      # (the training's skill) {max-tier}; all but no-focus also {proficiency}
      # {tier} {points} {cost}.
      added: "{prefix}<green>Added {amount} points to {player}'s {proficiency} ({points}/{cost})."
      added-target: "{prefix}<green>You gained <gold>{amount} points <green>in {proficiency} ({points}/{cost})."
      tier-up: "{prefix}<green>{player}'s {proficiency} is now {tier}!"
      tier-up-target: "{prefix}<gold>Your {proficiency} is now {tier}!"
      # Sent after tier-up-target when the proficiency reached the top tier.
      mastered: "{prefix}<gold>You have mastered {proficiency}! Pick a new proficiency with /proficiency focus (proficiency)."
      no-focus: "{prefix}<red>{player} isn't training any proficiency, no points were added."
      no-focus-target: "{prefix}<red>Your {skill} training was lost: you aren't training any proficiency. Pick one with /proficiency focus (proficiency)."
      other-skill: "{prefix}<red>{player} is training {proficiency}, which isn't a {skill} proficiency. No points were added."
      other-skill-target: "{prefix}<red>Your {skill} training was lost: {proficiency} isn't a {skill} proficiency."
      at-max-tier: "{prefix}<red>{player}'s {proficiency} is already {tier}, this training only goes up to {max-tier}. No points were added."
      at-max-tier-target: "{prefix}<red>This training only goes up to {max-tier} and your {proficiency} is already {tier}. No points were added."
    remove:
      usage: "{prefix}<red>Usage: /proficiency points remove (player) (amount)"
      # {player} {proficiency} {points} {cost}
      removed: "{prefix}<green>{player}'s {proficiency} now has {points}/{cost} points."
    set:
      usage: "{prefix}<red>Usage: /proficiency points set (player) (amount)"
      # {player} {proficiency} {points} {cost}
      set: "{prefix}<green>{player}'s {proficiency} now has {points}/{cost} points."
      # {proficiency} {max}. Tiers change with /proficiency tier set.
      too-high: "{prefix}<red>{proficiency} can have at most {max} points, use /proficiency tier set to change its tier."
  tier:
    usage: "{prefix}<red>Usage: /proficiency tier set (player) (proficiency) (tier)"
    # {player} {proficiency} {tier}
    set: "{prefix}<green>Set {player}'s {proficiency} to {tier}."
    set-target: "{prefix}<gold>Your {proficiency} is now {tier}."
  # The proficiency picker shown during /setup, after the skill picker.
  choice:
    title: "<gold><bold>Proficiency Selection"
    # The header's lines, then one skill-picks line per skill with picks, in the
    # skill's colour from skills.yml. {skill} {picks}
    lore:
      - "<gray>Pick the proficiencies your character starts Proficient in."
      - "<gray>Each pick goes to a proficiency of its own skill."
      - "<gray>Picks left:"
    skill-picks: "{skill}: {picks}"
    confirm: "<green>Confirm"
    # The name of each proficiency on the screen, in its colour from proficiencies.yml. {name}
    proficiency-name: "<bold>{name}</bold>"
    # Added under the trained proficiencies, which every new character gets.
    trained:
      - "<green>Already trained"
    # Confirming with picks left that could still be used. {picks} {skill}
    pick-more: "{prefix}<red>Pick {picks} more {skill} proficiency(s) before confirming."

setup:
  already-set-up: "{prefix}<red>You have already set up your profile!"
  started: "{prefix}<red>You are now setting up your profile!"
  completed: "{prefix}<green>Your Setup have been Completed!"
  # The stat point screen of /setup, built from the setup: parts of stats.yml.
  title: "Stat Points Allocation"
  header:
    name: "<gold>Stat Points Allocation"
    # {points} {negative-points}
    lore:
      - "<gray>Allocate your stat points to your character's base stats"
      - "<gray>You can lower a stat below its starting value"
      - "<gray>to gain 1 extra point for each point lowered"
      - "<gray>Points Remaining: <gold>{points}"
      - "<gray>Negative Points: <red>{negative-points}"
  stat:
    # {name} {value} {min} {max}. The text takes the stat's colour from stats.yml;
    # the stat's own lore lines from stats.yml come after these.
    name: "<bold>{name}:</bold> {value}"
    lore:
      - "<gold>Points Allocated: {value}"
      - "<gold>Left Click to Increase by 1, Right Click to Decrease by 1"
  confirm:
    name: "<green>Confirm"
  points-left: "{prefix}<red>You still have points to allocate!"

# Stat commands: /stats, and the command names in stats.yml (/heal, /damage...).
# A stat action's messages are stats.<stat id>.<action> (set, add, reduce or
# damage) when they exist here, otherwise stats.default.<action>. ".player" goes
# to the player whose stat changed, ".sender" to whoever ran the command when that
# is someone else.
# They get {amount} {value} (the new value) {old} {player} {sender} {name} {stat}.
stats:
  default:
    set:
      player: "{prefix}<yellow>{name} <gray>has been set to <yellow>{value}"
      sender: "{prefix}<yellow>{player}<gray>'s <yellow>{name} <gray>has been set to <yellow>{value}"
    add:
      player: "{prefix}<yellow>{name} <gray>has been raised by <yellow>{amount}<gray>, it is now <yellow>{value}"
      sender: "{prefix}<gray>Added <yellow>{amount} {name} <gray>to <yellow>{player}<gray>, it is now <yellow>{value}"
    reduce:
      player: "{prefix}<yellow>{name} <gray>has been reduced by <yellow>{amount}<gray>, it is now <yellow>{value}"
      sender: "{prefix}<gray>Reduced <yellow>{player}<gray>'s <yellow>{name} <gray>by <yellow>{amount}<gray>, it is now <yellow>{value}"
    damage:
      player: "{prefix}<gray>You have been damaged for <red>{amount} <gray>{name}! It is now <red>{value}<gray>!"
      sender: "{prefix}<gray>Damaged {player} for <red>{amount} <gray>{name}! It is now <red>{value}<gray>!"
  hp:
    add:
      player: "{prefix}<green>You have been healed for<gold> {amount} HP<green>! Your health is now <gold>{value}<green>!"
      sender: "{prefix}<gray>Added {amount} HP to {player}!"
    reduce:
      player: "{prefix}<red>Your HP has been reduced by <gold> {amount}<red>! Your current HP is <gold> {value}<red>!"
      sender: "{prefix}<gray>Reduced {amount} HP to {player}!"
    damage:
      player: "{prefix}<gray>You have been damaged for <red> {amount} <gray>hp! Your health is now <red>{value}<gray>!"
      sender: "{prefix}<gray>Damaged {player} for <red>{amount} <gray>hp! Their health is now <red>{value}<gray>!"
  temphp:
    set:
      player: "{prefix}<#67e4e1>Your temp HP has been set to <gold>{amount}<#67e4e1>!"
      sender: "{prefix}<#67e4e1>Set <yellow>{player}<#67e4e1>'s temp HP to <gold>{amount}<#67e4e1>!"
  ac:
    set:
      player: "{prefix}<green>AC set to <gold>{amount}<green>"
      sender: "{prefix}<green>Set {player}'s AC to <gold>{amount}"
  potion:
    set:
      player: "{prefix}<green>Your Potion Sickness has been set to {amount}"
      sender: "{prefix}<green>Set {player}'s Potion Sickness to {amount}"
  errors:
    # {usage}
    usage: "{prefix}<red>Not enough arguments! (Usage: {usage})"
    # {stat}
    unknown-stat: "{prefix}<yellow>\"{stat}\" <red>is not a stat!"
    unknown-command: "{prefix}<red>This command is no longer in stats.yml."
    # {input}
    negative-amount: "{prefix}<red>The amount can't be negative: {input}"
    # {name}
    no-shield: "{prefix}<red>{name} can't be damaged, it has no shield. Use reduce instead."
    # {player}
    no-character: "{prefix}<red>{player} has no character with stats."
  # /stats view. The lines get {player} and every stat placeholder: {str},
  # {str_base}, {str_modifiers}, {hp}, {max_hp}, {max_hp_modifiers}... (the same
  # names as the PlaceholderAPI ones). A stat these lines never mention gets a
  # sheet-auto line under them, so new stats always show; sheet-footer comes last.
  sheet:
    - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
    - "                <#F6DA23>{player}' s <#864811>Stat Sheet:"
    - ""
    - "<#D0530C><bold>Main Stats</bold>"
    - "<#B1262C><bold>Str:</bold> <#B1262C>{str}<#71272a> ({str_modifiers}) <#864811>| <#55B141><bold>Dex:</bold> <#55B141>{dex} <#3c5936> ({dex_modifiers}) <#864811>| <#D4992C><bold>Con:</bold> <#D4992C>{con}<#766035> ({con_modifiers})"
    - "<#2B8EDE><bold>Foc:</bold> <#2B8EDE>{foc}<#3b678a> ({foc_modifiers}) <#864811>| <#F2F39B><bold>Spd:</bold> <#F2F39B>{spd}<#adad5d> ({spd_modifiers})"
    - ""
    - "<#D0530C><bold>Health and AC</bold>"
    - "<#EE5B79><bold>HP:</bold> <#EE5B79>{hp}<#831F34>/<#EE5B79>{max_hp}<#8d394a> ({max_hp_modifiers}) <#864811>| <#513E3E><bold>AC:</bold> <#513E3E>{ac}"
    - "<#67e4e1><bold>Temp HP:</bold> <#67e4e1>{temphp}"
    - ""
    - "<#D0530C><bold>Afflictions</bold>"
    - "<#21ABA5><bold>Arcrot:</bold> <#21ABA5>{arcrot}<#0D5653>/<#21ABA5>{max_arcrot}<#2d6765> ({arcrot_modifiers}/{max_arcrot_modifiers}) <#864811>| <#2EB12C><bold>Potion Sickness:</bold> <#2EB12C>{potion}<#094C08>/<#2EB12C>{max_potion}<#3c733b> ({max_potion_modifiers})"
    - "<#710E86><bold>Fictis Apotheosis:</bold> <#710E86>{fictis}<#410F4C>/<#710E86>{max_fictis}<#422947> ({fictis_modifiers}/{max_fictis_modifiers})"
  sheet-auto:
    # {name} {stat} {value} {base} {modifiers}, and for bars {max} {max_modifiers}
    value: "<#864811><bold>{name}:</bold> <#F6DA23>{value}<#864811> ({modifiers})"
    bar: "<#864811><bold>{name}:</bold> <#F6DA23>{value}<#864811>/<#F6DA23>{max}<#864811> ({modifiers}/{max_modifiers})"
  sheet-footer:
    - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"

# /modifier add|del|view. The "-max" messages are for modifiers on a bar's max
# (max_hp...), so they can say "Max HP" in any language.
# They get {target} (the stat id or max_<bar>) {name} {amount} {index} {player}.
modifier:
  added: "{prefix}<gold>{name} <gray>has been modified by <gold>{amount}"
  added-max: "{prefix}<gold>Max {name} <gray>has been modified by <gold>{amount}"
  removed: "{prefix}<gray>Modifier removed!"
  removed-max: "{prefix}<gray>Modifier removed!"
  # {input}
  not-a-target: "{prefix}<gray>\"{input}\" is not a stat!"
  # {index}
  no-such-modifier: "{prefix}<gray>index \"{index}\" is out of bounds! There's no modifier with that id"
  # {input}
  invalid-page: "{prefix}<red>Invalid page number!"
  view:
    # header, empty and footer get {player} {page}
    header:
      - "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
      - "                <#F6DA23>{player}' s <#864811>Modifiers (page {page}):"
    empty: "<#F6DA23>No modifiers found!"
    line: "<#F6DA23>{index}. <#864811>{name}: <#63C934>{amount}"
    line-max: "<#F6DA23>{index}. <#864811>Max {name}: <#63C934>{amount}"
    footer: "<#864811>|====================<<<#63C934>₪<#864811>>>====================|"
