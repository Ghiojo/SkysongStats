# The injuries characters can have: broken bones, burns, bruised ribs...
# Staff give them with /injury award. A character also learns every injury it gets,
# and /injury list shows the injuries a character knows.
# Changes apply with /ssreload. A file with mistakes is not reloaded: the console
# lists every mistake and the injuries from before stay in use.

# Every severity an injury may have, in the order /injury list tab-completes them.
# Each injury picks one. A severity no injury uses is fine.
severities: [minor, moderate, severe, permanent]

# Each injury, under its id (lowercase letters, digits, '_' and '-'):
#   name:        shown everywhere. MiniMessage. Default: the id.
#   description: shown on hover and in /injury list. MiniMessage. Default: none.
#   icon:        the /injury list menu item: a Material (BONE) or model:<namespace:id>.
#                Default: PAPER.
#   severity:    one of severities above. Required.
#   message:     said when the injury is awarded. {character} is the character's
#                name, {injury} the injury as chat shows it (its name, with the
#                description on hover). MiniMessage. Optional: "" or left out for
#                no message.
#   effects:     optional. Leave it out for an injury that changes nothing.
#     modifiers: stat modifiers while a character has the injury, as one text split
#                by commas ("str-1, dex+2") or a list. Each entry is
#                <stat><+ or -><amount>: a stat id or alias from stats.yml, or
#                max_<bar> for a bar's max (max_hp), and a whole number.
#     conditions: conditions from conditions.yml the character has while it has
#                the injury, each with an optional :level (default 1), like
#                [weakened, "bleeding:2"]. They go away with the injury.
#
# Removing an injury removes its modifiers and its conditions with it.
#
# Example:
#   broken-leg:
#     name: "<red>Broken Leg"
#     description: "The bone is snapped below the knee."
#     icon: BONE
#     severity: severe
#     message: "{character} feels their leg buckle as the bones snap, they now have a {injury}"
#     effects:
#       modifiers: "dex-2, max_hp-5"
#       conditions: [weakened, "bleeding:2"]
#   bruised-ribs:
#     name: "Bruised Ribs"
#     description: "It hurts to breathe."
#     icon: PAPER
#     severity: minor
injuries: {}
